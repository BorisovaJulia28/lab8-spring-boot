<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Форма студента</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container py-4">
    <h1 class="mb-4"
        th:text="${student.id == null ? 'Добавить студента' : 'Изменить студента'}">
        Форма студента
    </h1>

    <form th:action="@{/saveStudent}"
          th:object="${student}" method="post"
          class="col-md-6">

        <input type="hidden" th:field="*{id}">

        <div class="mb-3">
            <label for="name" class="form-label">Имя</label>
            <input id="name" type="text" th:field="*{name}"
                   class="form-control" maxlength="15" required>
            <div th:errors="*{name}" class="text-danger"></div>
        </div>

        <div class="mb-3">
            <label for="surname" class="form-label">Фамилия</label>
            <input id="surname" type="text" th:field="*{surname}"
                   class="form-control" maxlength="25" required>
            <div th:errors="*{surname}" class="text-danger"></div>
        </div>

        <div class="mb-3">
            <label for="faculty" class="form-label">Факультет</label>
            <input id="faculty" type="text" th:field="*{faculty}"
                   class="form-control" maxlength="20" required>
            <div th:errors="*{faculty}" class="text-danger"></div>
        </div>

        <div class="mb-3">
            <label for="age" class="form-label">Возраст</label>
            <input id="age" type="number" th:field="*{age}"
                   class="form-control" min="1" step="1" required>
            <div th:errors="*{age}" class="text-danger"></div>
        </div>

        <button type="submit" class="btn btn-success">
            Сохранить
        </button>
        <a th:href="@{/list}" class="btn btn-secondary">
            К списку
        </a>
    </form>
</div>
</body>
</html>
