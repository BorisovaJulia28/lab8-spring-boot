<!DOCTYPE html>
<html lang="ru"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Список студентов</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container py-4">
    <nav class="mb-4">
        <a th:href="@{/list}" class="btn btn-primary">Студенты</a>
        <a th:href="@{/users}" class="btn btn-outline-primary">
            Пользователи
        </a>
        <a th:href="@{/}" class="btn btn-outline-secondary">
            Главная
        </a>

        <form th:action="@{/logout}" method="post" class="d-inline">
            <button type="submit" class="btn btn-secondary">
                Выйти
            </button>
        </form>
    </nav>

    <p>
        Вы вошли как
        <strong sec:authentication="name"></strong>
    </p>

    <h1 class="mb-4">Список студентов</h1>

    <a th:href="@{/addStudentForm}" class="btn btn-success mb-3">
        Добавить студента
    </a>

    <div class="table-responsive">
        <table class="table table-bordered table-striped align-middle">
            <thead>
            <tr>
                <th>ID</th>
                <th>Имя</th>
                <th>Фамилия</th>
                <th>Факультет</th>
                <th>Возраст</th>
                <th>Действия</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${#lists.isEmpty(students)}">
                <td colspan="6" class="text-center">
                    Студентов пока нет
                </td>
            </tr>

            <tr th:each="student : ${students}">
                <td th:text="${student.id}"></td>
                <td th:text="${student.name}"></td>
                <td th:text="${student.surname}"></td>
                <td th:text="${student.faculty}"></td>
                <td th:text="${student.age}"></td>
                <td>
                    <a th:href="@{/showUpdateForm(studentId=${student.id})}"
                       class="btn btn-warning btn-sm">
                        Изменить
                    </a>

                    <form th:action="@{/deleteStudent}" method="post"
                          class="d-inline"
                          onsubmit="return confirm('Удалить студента?');">
                        <input type="hidden" name="studentId"
                               th:value="${student.id}">
                        <button type="submit" class="btn btn-danger btn-sm">
                            Удалить
                        </button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
