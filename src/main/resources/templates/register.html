<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Регистрация</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container py-5">
    <div class="col-md-6 mx-auto">
        <h1 class="mb-4">Регистрация</h1>

        <div th:if="${param.success}" class="alert alert-success">
            Регистрация прошла успешно. Теперь можно войти.
        </div>

        <form th:action="@{/register/save}"
              th:object="${user}" method="post">

            <div th:if="${#fields.hasGlobalErrors()}"
                 class="alert alert-danger">
                <p th:each="error : ${#fields.globalErrors()}"
                   th:text="${error}" class="mb-0"></p>
            </div>

            <div class="mb-3">
                <label for="firstName" class="form-label">Имя</label>
                <input id="firstName" type="text" th:field="*{firstName}"
                       class="form-control" maxlength="50"
                       autocomplete="given-name" required>
                <div th:errors="*{firstName}" class="text-danger"></div>
            </div>

            <div class="mb-3">
                <label for="lastName" class="form-label">Фамилия</label>
                <input id="lastName" type="text" th:field="*{lastName}"
                       class="form-control" maxlength="50"
                       autocomplete="family-name" required>
                <div th:errors="*{lastName}" class="text-danger"></div>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">Электронная почта</label>
                <input id="email" type="email" th:field="*{email}"
                       class="form-control" maxlength="254"
                       autocomplete="email" required>
                <div th:errors="*{email}" class="text-danger"></div>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">Пароль</label>
                <input id="password" name="password" type="password"
                       class="form-control" minlength="8" maxlength="64"
                       autocomplete="new-password" required>
                <div class="form-text">От 8 до 64 символов.</div>
                <div th:errors="*{password}" class="text-danger"></div>
            </div>

            <button type="submit" class="btn btn-success">
                Зарегистрироваться
            </button>
            <a th:href="@{/}" class="btn btn-secondary">На главную</a>
        </form>

        <p class="mt-3">
            Уже есть аккаунт?
            <a th:href="@{/login}">Войти</a>
        </p>
    </div>
</div>
</body>
</html>
